# dbt project for the CS2 Analytics transformation layer (Phase 4).
#
# dbt owns analytics transformations only. The core ingestion schema
# (matches, maps, players, and the *_ingestion_state tables) stays owned
# by Alembic migrations; dbt reads those tables as sources and never
# manages or migrates them.

name: "cs2_analytics"
version: "1.0.0"

# The generic-test `arguments:` nesting used in the model yml requires
# dbt 1.10+; fail fast on older installs instead of misparsing tests.
require-dbt-version: [">=1.10.0", "<2.0.0"]

profile: "cs2_analytics"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Every data test stores its failing rows in an audit table so a red or
# yellow run can be triaged by querying the rows, not by re-running the
# test (#148). With the profile's schema set to "analytics", the custom
# schema suffix lands the audit tables in "analytics_dbt_test__audit".
# Severity policy (see docs/dbt_models.md): structural grain/key/
# relationship tests stay at the default error; distribution-style
# tests are declared warn at the test site until proven stable.
data_tests:
  cs2_analytics:
    +store_failures: true
    +schema: dbt_test__audit

models:
  cs2_analytics:
    staging:
      # Staging models are thin views over the Alembic-owned sources.
      +materialized: view
    intermediate:
      # Intermediate models are reusable-join views over staging models.
      +materialized: view
    marts:
      # Marts are business-ready fact/dim tables for analytics and API reads.
      +materialized: table
