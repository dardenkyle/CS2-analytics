# Local development stack. `docker compose up` starts PostgreSQL, creates
# and migrates the development database, then starts the API. Every
# service connects to the `db` container only; nothing here can reach a
# deployed database.
services:
  db:
    image: postgres:17
    environment:
      # Development and test data live in separate databases in this one
      # container: cs2_dev here, cs2_test for the test suite (.env.test,
      # docker-compose.test.yml), which truncates tables. PostgreSQL only
      # creates this initial database on an empty volume, so each side
      # creates its own when missing: the migrate service for development,
      # the test bootstrap for tests.
      POSTGRES_DB: cs2_dev
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASS:-change_me}"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    image: cs2-analytics:local
    environment: &app_environment
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      DEBUG_MODE: "${DEBUG_MODE:-false}"
      API_HOST: "0.0.0.0"
      API_PORT: "${API_PORT:-8000}"
      API_CORS_ORIGINS: "${API_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8501,http://127.0.0.1:8501,http://localhost:8000,http://127.0.0.1:8000}"
      DB_NAME: "${DB_NAME:-cs2_dev}"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASS: "${DB_PASS:-change_me}"
      DB_HOST: "db"
      DB_PORT: "5432"
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./logs:/app/logs
    shm_size: "2gb"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; port = os.environ.get('API_PORT', '8000'); urllib.request.urlopen('http://127.0.0.1:' + port + '/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot: creates DB_NAME when it does not exist, applies migrations,
  # and exits. The app waits for it, so `docker compose up` always yields a
  # migrated database.
  migrate:
    image: cs2-analytics:local
    build:
      context: .
    environment: *app_environment
    command: ["python", "manage_db.py", "--create-database"]
    depends_on:
      db:
        condition: service_healthy

  pipeline:
    image: cs2-analytics:local
    build:
      context: .
    profiles: ["tools"]
    environment: *app_environment
    command: ["sh", "-c", "cs2a ingest discover && cs2a process"]
    volumes:
      - ./logs:/app/logs
    shm_size: "2gb"
    depends_on:
      db:
        condition: service_healthy

  smoke:
    image: cs2-analytics:local
    build:
      context: .
    profiles: ["tools"]
    environment:
      <<: *app_environment
      SMOKE_API_BASE_URL: "http://app:${API_PORT:-8000}"
      SMOKE_API_TIMEOUT_SECONDS: "10"
    command: ["python", "scripts/deployment_smoke.py"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  postgres_data:
